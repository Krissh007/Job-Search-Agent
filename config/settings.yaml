project:
  name: job_search_agent
  timezone: Asia/Kolkata
  database_path: data/jobs.db
  export_directory: data/exports
  log_directory: data/logs

browser:
  headless: false
  default_timeout_ms: 30000
  navigation_timeout_ms: 60000
  reuse_existing_profile: false

search:
  keywords:
    - business analyst
  locations:
    - Hyderabad
  max_results_per_query: 60
  max_pages_per_source: 10
  max_posted_days: 30
  freshness_windows_days:
    - 7
    - 30
  minimum_match_score: 45
  minimum_evidence_matches: 2
  india_only: true

sources:
  - naukri

application:
  prepare_after_search: true
  max_jobs_per_run: 10
